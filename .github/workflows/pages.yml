# Publica o site no GitHub Pages a cada envio (push) para a branch main.
# Antes de publicar, regenera conteudo/_gerado.js, então o site nunca sai desatualizado.
# Requer: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite rodar manualmente na aba Actions

# "actions: read" é necessário para o passo de publicação encontrar o artefato
# (sem ele, repositórios privados e algumas organizações dão "Found 0 artifact(s)").
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Monta a pasta que vai ao ar e a envia como artefato
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar o conteúdo (materia.md + roteiro.js → _gerado.js)
        run: node atualizar-conteudo.js

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Montar a pasta publicada (só o que o site usa)
        run: |
          mkdir _site
          cp -r index.html 404.html assets conteudo _site/
          touch _site/.nojekyll
          echo "Conteúdo da pasta publicada:"
          ls -la _site
          du -sh _site

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2) Publica o artefato no Pages
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
