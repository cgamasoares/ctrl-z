<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada – CTRL+Z</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #2a63c4; color: #fff; font: 16px Tahoma, Verdana, system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 20px; }
    a { display: inline-block; padding: 10px 20px; background: #fff; color: #06308a; border-radius: 4px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>Esse endereço não existe no site da reportagem.</p>
    <a id="voltar" href="/">Voltar ao início</a>
  </main>
  <script>
    /* Em sites de projeto (usuario.github.io/repositorio/) o início é /repositorio/, e não /. */
    (function () {
      var base = "/";
      if (/\.github\.io$/i.test(location.hostname)) {
        var parte = location.pathname.split("/")[1];
        if (parte) base = "/" + parte + "/";
      }
      document.getElementById("voltar").href = base;
    })();
  </script>
</body>
</html>
